<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>
    <style>
.slide{width:500px; height: 400px; position: absolute; left:50%; transform: translateX(-50%) }
.gallery{text-align: center; color: brown}
    </style>
</head>
<body>
    <h1 class="gallery">Gallery</h1>
    <img id="slider" class="slide"  src="IMG_20210703_110643.jpg" alt="slider-image">
    <script>
let images=["IMG_20210703_110643.jpg", "IMG_20210705_171829.jpg", "IMG_20211219_142757.jpg"];
let index=0;
setInterval(function(){
index++;
    if (index>=images.length)
{
    index=0;
}
document.getElementById("slider").src=images[index];

},2000);
 </script>
</body>
</html>j
